services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stockea
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d stockea"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0   # fija una versión concreta
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://keycloak.localhost
      KC_PROXY_HEADERS: xforwarded
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - kcdata:/opt/keycloak/data
      - ./infra/keycloak/stockea-realm.json:/opt/keycloak/data/import/stockea-realm.json:ro

  vault:
    image: hashicorp/vault:1.17            # fija una versión concreta
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1026}:1025"   # SMTP (puerto del contenedor)
      - "127.0.0.1:8025:8025"   # interfaz web

  backend:
    build: .
    environment:
      PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: stockea
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VAULT_ADDR: http://vault:8200
      STOCKEA_VAULT_ROLE_ID: ${STOCKEA_VAULT_ROLE_ID:-}
      STOCKEA_VAULT_SECRET_ID_FILE: /run/secrets/vault/secret-id
      STOCKEA_IDP_URL: http://keycloak:8080
      STOCKEA_IDP_ISSUER_URI: https://keycloak.localhost/realms/stockea
      STOCKEA_IDP_JWK_SET_URI: http://keycloak:8080/realms/stockea/protocol/openid-connect/certs
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-responder@stockea.local
      MAIL_SMTP_AUTH_ENABLED: false
      MAIL_SMTP_STARTTLS_ENABLED: false
      SERVER_SSL_ENABLED: true
      SERVER_SSL_KEY_STORE: file:/run/secrets/backend-keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: stockea-local-dev
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
    volumes:
      - ./.vault:/run/secrets/vault:ro
      - ./infra/proxy/backend-keystore.p12:/run/secrets/backend-keystore.p12:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../stockea-frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infra/proxy/backend.crt:/etc/caddy/certs/backend.crt:ro
    depends_on:
      - backend

volumes:
  pgdata:
  kcdata:
  caddy_data:
  caddy_config:
