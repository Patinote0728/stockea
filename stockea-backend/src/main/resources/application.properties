spring.application.name=stockea-backend
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockea}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false

spring.config.import=optional:file:.env[.properties]

stockea.vault.uri=${VAULT_ADDR:http://localhost:8200}
stockea.vault.role-id=${STOCKEA_VAULT_ROLE_ID:}
stockea.vault.secret-id-file=${STOCKEA_VAULT_SECRET_ID_FILE:.vault/secret-id}

stockea.proveedor-identidad.url-base=${STOCKEA_IDP_URL:http://localhost:8080}
stockea.proveedor-identidad.reino=${STOCKEA_IDP_REALM:stockea}
stockea.proveedor-identidad.cliente-verificador=${STOCKEA_IDP_VERIFIER_CLIENT_ID:stockea-pwd-verifier}
stockea.proveedor-identidad.cliente-administrativo=${STOCKEA_IDP_ADMIN_CLIENT_ID:stockea-admin-api}
stockea.proveedor-identidad.timeout=${STOCKEA_IDP_TIMEOUT:2s}

stockea.seguridad.issuer-uri=${STOCKEA_IDP_ISSUER_URI:${STOCKEA_IDP_URL:http://localhost:8080}/realms/stockea}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${stockea.seguridad.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${STOCKEA_IDP_JWK_SET_URI:${STOCKEA_IDP_URL:http://localhost:8080}/realms/stockea/protocol/openid-connect/certs}

stockea.correo.host=${MAIL_HOST:localhost}
stockea.correo.puerto=${MAIL_PORT:1025}
stockea.correo.remitente=${MAIL_FROM:no-responder@stockea.local}
stockea.correo.autenticacion-habilitada=${MAIL_SMTP_AUTH_ENABLED:false}
stockea.correo.starttls-habilitado=${MAIL_SMTP_STARTTLS_ENABLED:false}
stockea.correo.timeout=${MAIL_SMTP_TIMEOUT:2s}
